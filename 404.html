<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1984 παρατηρητήριο</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="theme-color" content="#F4F4F1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 1984 — παρατηρητήριο · placeholder page. Same tokens as web/static/1984.css,
   inlined so this page needs no other file from the site. */
:root{--paper:#F4F4F1;--ink:#17181A;--muted:#63666C;--faint:#9A9C99;--serif:"GFS Didot",serif;--mono:"IBM Plex Mono",monospace}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font:15px/1.6 var(--mono)}
.site-header{border-bottom:1px solid var(--ink)}
.site-header__inner{max-width:1200px;margin:0 auto;padding:0 40px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:14px 0}
.brand__logo{font:400 26px/1 var(--serif);color:inherit;text-decoration:none}
.brand__tag{font:600 11px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.brand__morse{font:11px var(--mono);letter-spacing:3px;color:var(--faint)}
.page{max-width:1200px;margin:0 auto;padding:48px 40px 100px}
.page-title{font:400 44px/1.15 var(--serif);margin:0}
@media (max-width:600px){
  .site-header__inner{padding:0 16px}
  .page{padding:32px 16px 64px}
  .page-title{font-size:32px}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <div class="brand">
      <a href="/" class="brand__logo">1984</a>
      <span class="brand__tag">παρατηρητήριο</span>
      <span class="brand__morse" aria-hidden="true">·–·· –·– ·––·</span>
    </div>
  </div>
</header>
<main class="page">
  <h1 class="page-title">Υπό κατασκευή</h1>
</main>
</body>
</html>
